syntax = "proto3";

package grpc.gateway.examples.internal.proto.examplemultipar;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/httpbody.proto";
import "protoc-gen-openapiv3/options/annotations.proto";

option go_package = "github.com/grpc-ecosystem/grpc-gateway/v2/examples/internal/proto/examplemultipar";

/*
 * StoredFile represents a stored file within the File Manager service.
 */
message StoredFile {
  reserved 1;  // Reserved for future use

  // Internal numeric identifier of the file.
  //
  // This identifier is generated by the persistence layer and is
  // intended for internal use only (e.g. database indexing, foreign
  // key relationships). It should not be exposed in business logic
  // or API responses intended for external clients.
  uint64 identifier = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "123456789"}
      format: "uint64"
    }
  ];

  // Human-readable name of the file as provided by the user.
  //
  // This value can be changed without re-uploading the binary and
  // represents the original filename from the user's perspective.
  // It may include special characters and spaces as provided during
  // upload.
  string original_file_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "Architecture-01.pdf"}
    }
  ];

  // MIME type of the stored file.
  //
  // This field specifies the media type according to IANA standards
  // and determines how the file should be processed, displayed, or
  // transmitted by client applications.
  string mime_type = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "application/pdf"}
    }
  ];

  // Size of the stored file in bytes.
  //
  // This value represents the exact byte count of the binary data
  // as stored in the external storage system. It is calculated after
  // the upload completes and remains immutable.
  int64 size_bytes = 5 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "2048576"}
      format: "int64"
    }
  ];

  // Unique identifier for the file in the external storage system.
  //
  // This field contains the actual filename used to store the binary
  // data in the external storage system (e.g., S3 object key). It
  // typically includes system-generated identifiers for uniqueness
  // and may differ from the original_file_name. This is the primary
  // reference for retrieving the file from storage.
  string file_storage_name = 6 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "1766506031321876443-5341347625942764273-Architecture-01.pdf"}
    }
  ];

  // Full storage path of the file binary.
  //
  // This field represents the complete path to the file within the
  // storage system, including any directory structure. It combines
  // the storage location prefix with the file_storage_name to form
  // the absolute path for storage operations.
  string file_path = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "projects/123/files/download/1766506031321876443-5341347625942764273-Architecture-01.pdf"}
    }
  ];
}

/*
 * StoredFileService provides APIs to upload, store and manage files.
 */
service StoredFileService {
  // Creates a new StoredFile.
  //
  // This operation performs the following steps atomically:
  // 1. Receives the binary content and metadata from the client.
  // 2. Uploads the binary to the configured storage backend.
  // 3. Persists the file metadata in the database.
  //
  // If any step fails, the operation must not leave partial state.
  //
  // The created StoredFile is returned with all OUTPUT_ONLY fields
  // populated by the system.
  rpc CreateStoredFile(CreateFileRequest) returns (StoredFile) {
    option (google.api.http) = {
      post: "/v1/example/files"
      body: "*"
    };
    option (protoc_gen_openapiv3.options.operation) = {
      security: [
        {
          additional_properties: [
            {
              name: "ApiKey"
              value: {
                value: []
              }
            }
          ]
        }
      ]
      request_body: {
        request_body: {
          description: "Form data for uploading a file and creating a StoredFile."
          content: {
            additional_properties: {
              name: "multipart/form-data"
              value: {
                schema: {
                  reference: {_ref: "#/components/schemas/CreateFileRequest"}
                }
                encoding: {
                  additional_properties: {
                    name: "content"
                    value: {
                      content_type: "image/jpeg, image/png, model/stl"
                      style: "form"
                    }
                  }
                }
              }
            }
          }
        }
      }
    };
  }

  // Downloads the binary content of a StoredFile.
  // Access is allowed only if the file belongs to the requested project.
  rpc DownloadStoredFile(DownloadStoredFileRequest) returns (stream google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/example/{project_code}/files/download/{file_storage_name}"
    };
    option (protoc_gen_openapiv3.options.operation) = {
      security: [
        {
          additional_properties: [
            {name: "ApiKey", value: {value: []}},
            {name: "Authorization", value: {value: []}} // JWT from customer login
          ]
        }
      ]
    };
  }
}

// CreateFileRequest is the request message for creating file metadata.
message CreateFileRequest {
  // File name for the uploaded file.
  string filename = 1 [(google.api.field_behavior) = REQUIRED];

  // File content as bytes.
  bytes content = 2 [(google.api.field_behavior) = REQUIRED];

  // MIME type of the file.
  string content_type = 3 [(google.api.field_behavior) = OPTIONAL];
}

/*
 * Request to download a stored file.
 * Only the file_storage_name (relative path or key) is required.
 */
message DownloadStoredFileRequest {
  // Identifier of the project this file belongs to.
  string project_code = 3 [
    (google.api.field_behavior) = IMMUTABLE,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "123"}
    }
  ];

  // Unique identifier for the file in the external storage system.
  string file_storage_name = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "1766506031321876443-5341347625942764273-Architecture-01.pdf"}
    }
  ];
}

/*
 * Response with the file binary.
 * Returns the file content as bytes.
 */
message DownloadStoredFileResponse {

  // Raw bytes of the requested file.
  bytes content = 1 [
    (protoc_gen_openapiv3.options.property) = {
      type: "string"
      format: "binary"
    }
  ];

  // Optional: MIME type of the file
  string mime_type = 2 [
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "model/stl"}
    }
  ];

  // Optional: Original filename
  string file_name = 3 [
    (protoc_gen_openapiv3.options.property) = {
      example: {yaml: "design_model.stl"}
    }
  ];
}
